spring.application.name=momentum-backend

# Local defaults; docker-compose sets SPRING_DATASOURCE_* for containers.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:momentum}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:momentum}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Shared sign-in (login-service). LOGIN_INTERNAL_URL lets server-to-server calls stay inside the cluster.
momentum.login.issuer=${LOGIN_ISSUER:http://localhost:8083}
momentum.login.internal-url=${LOGIN_INTERNAL_URL:${momentum.login.issuer}}
momentum.login.client-secret=${LOGIN_CLIENT_SECRET:}
momentum.public-url=${MOMENTUM_PUBLIC_URL:http://localhost:3000}

server.servlet.session.timeout=14d
server.servlet.session.cookie.name=MOMENTUM_SESSION
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${MOMENTUM_SESSION_COOKIE_SECURE:false}
